<!DOCTYPE html>
<!--
  CosmoX Origin — Claude Motion Graphics starter template (9:16)
  HOW TO RENDER FRAMES (Puppeteer):
    const b = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
    const p = await b.newPage();
    await p.setViewport({ width: 1080, height: 1920 });
    await p.goto('file://' + __dirname + '/template.html');
    for (let i = 0; i <= 120; i++) {
      await p.evaluate(t => window.__renderAt(t), i * (1000 / 30));
      await p.screenshot({ path: `frames/f${String(i).padStart(4,'0')}.png` });
    }
    Then: ffmpeg -framerate 30 -i frames/f%04d.png -c:v libx264 -pix_fmt yuv420p out.mp4
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family:'Montserrat'; font-weight:100 900; src:url('fonts/montserrat-var.ttf'); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#0a0a0c; font-family:'Montserrat',sans-serif; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; }
/* soft orange ambience */
.ambient { position:absolute; width:1100px; height:1100px; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,94,0,.30) 0%, rgba(255,94,0,.10) 40%, transparent 68%);
  top:-320px; right:-360px; }
/* faint grid */
.grid-bg { position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:90px 90px;
  -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%);
          mask-image:radial-gradient(ellipse at center, black 30%, transparent 75%); }
.vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events:none; }
/* animated progress bar */
#progress { position:absolute; top:0; left:0; height:10px; width:0%;
  background:linear-gradient(90deg,#ff8a2a,#ff5e00); }
.center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 90px; text-align:center; }
/* icon badge */
.badge { width:132px; height:132px; border-radius:44px; margin:0 auto 44px;
  background:linear-gradient(160deg, rgba(255,138,42,.22), rgba(255,94,0,.08));
  border:2px solid rgba(255,157,77,.55); display:flex; align-items:center; justify-content:center;
  will-change:transform,opacity; }
.badge svg { width:64px; height:64px; stroke:#ffa04d; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
/* kinetic headline */
.line { overflow:hidden; }
.line span { display:inline-block; will-change:transform; font-size:124px; font-weight:900; line-height:1.14; color:#fff; letter-spacing:-1px; }
.grad { background:linear-gradient(135deg,#ffb35c,#ff7a1a 60%,#ff5e00);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
/* sub copy */
.sub { margin-top:44px; font-size:42px; font-weight:600; color:#c9c9cf; line-height:1.55; will-change:transform,opacity; }
.sub b { color:#fff; font-weight:800; }
/* brand footer */
.footer { position:absolute; bottom:70px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:18px; }
.footer .dot { width:14px; height:14px; border-radius:50%; background:#ff7a1a; }
.footer span { font-size:32px; font-weight:700; letter-spacing:4px; color:#8a8a90; }
</style></head>
<body>
<div id="stage">
  <div class="ambient"></div>
  <div class="grid-bg"></div>
  <div id="progress"></div>
  <div class="center">
    <div class="badge" id="badge">
      <svg viewBox="0 0 64 64"><path d="M13 2 4 36h18l-3 26 18-34H19z"/></svg>
    </div>
    <div class="line"><span id="l1">YOUR TEXT</span></div>
    <div class="line"><span id="l2" class="grad">IN MOTION</span></div>
    <div class="sub" id="sub">Edit the <b>headline</b>, sub-copy and badge<br>then render your own version.</div>
  </div>
  <div class="vignette"></div>
  <div class="footer"><div class="dot"></div><span>YOUR BRAND</span></div>
</div>
<script>
/* ---------- tiny animation engine: call __renderAt(t) per frame ---------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeOut = v => 1 - Math.pow(1 - clamp01(v), 3);
const easeBack = v => { v = clamp01(v); return 1 + 2.2 * Math.pow(v - 1, 3) + 1.2 * Math.pow(v - 1, 2); };
const DUR = 4000;
function renderAt(t) {
  // badge pops in with a spring
  const bp = easeBack(t / 500);
  const badge = document.getElementById('badge');
  badge.style.opacity = clamp01(bp);
  badge.style.transform = 'scale(' + Math.max(0.01, bp) + ')';
  // headline lines rise in, staggered
  [['l1', 350], ['l2', 520]].forEach(([id, t0]) => {
    const p = easeOut((t - t0) / 600);
    document.getElementById(id).style.transform = 'translateY(' + ((1 - p) * 115) + '%)';
  });
  // sub fades up
  const sp = easeOut((t - 1050) / 500);
  const sub = document.getElementById('sub');
  sub.style.opacity = sp;
  sub.style.transform = 'translateY(' + ((1 - sp) * 40) + 'px)';
  // progress bar
  document.getElementById('progress').style.width = (clamp01(t / DUR) * 100) + '%';
}
window.__renderAt = renderAt;
renderAt(0);
</script>
</body></html>
